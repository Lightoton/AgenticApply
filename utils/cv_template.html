<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CV</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 11px;
            line-height: 1.4;
            color: #333;
            margin: 0;
            padding: 40px;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .subtitle {
            text-align: center;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .contact {
            text-align: center;
            font-size: 10px;
            margin-bottom: 20px;
            color: #555;
        }
        .contact span {
            color: #0066cc;
            font-weight: bold;
        }
        a {
            color: #0066cc;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        h2 {
            font-size: 14px;
            border-bottom: 2px solid #333;
            padding-bottom: 2px;
            margin-top: 15px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }
        p {
            margin: 0 0 10px 0;
            text-align: justify;
        }
        ul {
            margin: 0 0 10px 0;
            padding-left: 20px;
        }
        li {
            margin-bottom: 4px;
        }
        .job-title {
            font-weight: bold;
            font-size: 12px;
        }
        .job-date {
            float: right;
            font-size: 11px;
            color: #666;
        }
        .job-header {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    {{ content }}
</body>
</html>
